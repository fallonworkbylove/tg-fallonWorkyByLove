<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
  />
  <title>Мои анкеты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0e12;
      --bg-elevated: #1c1c22;
      --card: #23232b;
      --card-hover: #2a2a34;
      --text: #ffffff;
      --muted: #8e8e9a;
      --accent: #e94560;
      --accent-soft: rgba(233, 69, 96, 0.16);
      --accent-hot: #ff2e63;
      --border: rgba(255, 255, 255, 0.08);
      --ok: #34c759;
      --danger: #ff453a;
      --radius: 16px;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      --tg-safe-top: env(safe-area-inset-top, 0px);
      --tg-safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      padding-bottom: calc(88px + var(--tg-safe-bottom));
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: calc(14px + var(--tg-safe-top)) 16px 14px;
      background: rgba(14, 14, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .topbar p {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 12px;
      background: var(--bg-elevated);
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .content { padding: 16px; }

    .hero {
      background: linear-gradient(145deg, rgba(233, 69, 96, 0.22), rgba(35, 35, 43, 0.9));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .hero h2 { font-size: 1.05rem; margin-bottom: 4px; }
    .hero p { color: var(--muted); font-size: 0.88rem; line-height: 1.4; }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-hot));
      color: #fff;
    }

    .btn-secondary {
      background: var(--bg-elevated);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: rgba(255, 69, 58, 0.16);
      color: #ff8a82;
      border: 1px solid rgba(255, 69, 58, 0.28);
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-full { width: 100%; }
    .btn-sm { padding: 8px 10px; font-size: 0.85rem; border-radius: 10px; }

    .create-row { margin-bottom: 14px; }

    .list { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .thumb {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      background: var(--bg-elevated);
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .thumb-fallback {
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      color: var(--muted);
    }

    .meta { flex: 1; min-width: 0; }
    .meta h3 {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta .sub {
      color: var(--muted);
      font-size: 0.84rem;
      margin-top: 2px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 999px;
      padding: 4px 10px;
    }

    .stats-line {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stats-line strong { color: var(--accent-hot); }

    .actions {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .empty {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.02);
    }

    .empty strong { display: block; color: var(--text); margin-bottom: 6px; }

    .error-banner {
      background: rgba(255, 69, 58, 0.12);
      border: 1px solid rgba(255, 69, 58, 0.35);
      color: #ffb4ae;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    /* Форма */
    .screen-form { display: none; }
    .screen-form.active { display: block; }
    .screen-list.hidden { display: none; }

    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label.field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    label.field span { font-weight: 600; }

    input[type="text"],
    input[type="url"],
    input[type="number"],
    textarea {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      color: var(--text);
    }

    input:focus, textarea:focus {
      border-color: rgba(233, 69, 96, 0.55);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    textarea { min-height: 110px; resize: vertical; line-height: 1.45; }

    .preview-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .preview {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      object-fit: cover;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .toggle-row strong {
      color: var(--text);
      font-size: 0.92rem;
    }

    .switch {
      position: relative;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .switch .slider {
      position: absolute;
      inset: 0;
      background: #3a3a44;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s;
    }

    .switch .slider::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }

    .switch input:checked + .slider {
      background: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 8px;
      margin-top: 4px;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: flex;
      gap: 4px;
      padding: 10px 10px calc(10px + var(--tg-safe-bottom));
      background: rgba(18, 18, 24, 0.96);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(14px);
      max-width: 480px;
      margin: 0 auto;
    }

    .bottom-nav a,
    .bottom-nav button {
      flex: 1;
      text-decoration: none;
      text-align: center;
      background: transparent;
      border: 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 8px 4px;
      border-radius: 12px;
      cursor: pointer;
    }

    .bottom-nav .active {
      color: var(--accent-hot);
      background: var(--accent-soft);
    }

    .snackbar {
      position: fixed;
      left: 50%;
      bottom: calc(78px + var(--tg-safe-bottom));
      transform: translateX(-50%) translateY(20px);
      background: #2c2c35;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: 600;
      font-size: 0.92rem;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
      white-space: nowrap;
    }

    .snackbar.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="btn-back-main" type="button" title="Назад" aria-label="Назад">←</button>
      <div>
        <h1 id="page-title">Мои анкеты</h1>
        <p id="page-sub">Управление профилями знакомств</p>
      </div>
    </header>

    <main class="content">
      <div id="error-box" class="error-banner" hidden></div>

      <section id="screen-list" class="screen-list">
        <div class="hero">
          <h2>Анкеты для лендинга</h2>
          <p>Создавайте профили, копируйте ссылку и смотрите переходы в Telegram.</p>
        </div>

        <div class="create-row">
          <button class="btn btn-primary btn-full" id="btn-create" type="button">➕ Создать новую</button>
        </div>

        <div id="profiles-loading" class="loading">Загрузка…</div>
        <div id="profiles-empty" class="empty" hidden>
          <strong>Пока нет анкет</strong>
          Создайте первую — и получите ссылку на лендинг.
        </div>
        <div id="profiles-list" class="list"></div>
      </section>

      <section id="screen-form" class="screen-form">
        <div class="form-card">
          <form id="profile-form" class="form-grid" autocomplete="off">
            <input type="hidden" id="field-id" value="" />

            <label class="field">
              <span>Имя</span>
              <input id="field-name" type="text" maxlength="100" placeholder="Алина" required />
            </label>

            <label class="field">
              <span>Возраст</span>
              <input id="field-age" type="number" min="18" max="45" step="1" placeholder="23" required />
            </label>

            <label class="field">
              <span>Город</span>
              <input id="field-city" type="text" maxlength="100" placeholder="Москва" />
            </label>

            <label class="field">
              <span>О себе</span>
              <textarea id="field-bio" placeholder="Коротко о себе от лица девушки…"></textarea>
            </label>

            <label class="field">
              <span>Ссылка Telegram</span>
              <input id="field-tg" type="url" placeholder="https://t.me/username" />
            </label>

            <label class="field">
              <span>Фото (URL)</span>
              <input id="field-photo" type="url" placeholder="https://…" />
            </label>

            <div class="preview-wrap">
              <img id="photo-preview" class="preview" alt="" hidden />
              <div id="photo-preview-fallback" class="preview thumb-fallback">📷</div>
            </div>

            <div class="toggle-row">
              <strong>Анкета активна</strong>
              <label class="switch" title="Активна">
                <input id="field-active" type="checkbox" checked />
                <span class="slider"></span>
              </label>
            </div>

            <div class="form-actions">
              <button class="btn btn-ghost" id="btn-cancel" type="button">Отмена</button>
              <button class="btn btn-primary" id="btn-save" type="submit">Сохранить</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Меню">
      <a href="index.html">Панель</a>
      <button type="button" class="active">Анкеты</button>
      <a href="index.html#learn">Учить</a>
      <a href="index.html#stats">Статы</a>
    </nav>
  </div>

  <div id="snackbar" class="snackbar" role="status">Сохранено ✅</div>

  <script>
    (() => {
      const tg = window.Telegram?.WebApp || null;
      const API_URL = new URL("api.php", window.location.href).toString();
      const LANDING_URL = new URL("landing.html", window.location.href).toString();

      const state = {
        workerId: null,
        profiles: [],
        editingId: null,
      };

      const els = {
        errorBox: document.getElementById("error-box"),
        screenList: document.getElementById("screen-list"),
        screenForm: document.getElementById("screen-form"),
        list: document.getElementById("profiles-list"),
        loading: document.getElementById("profiles-loading"),
        empty: document.getElementById("profiles-empty"),
        form: document.getElementById("profile-form"),
        fieldId: document.getElementById("field-id"),
        fieldName: document.getElementById("field-name"),
        fieldAge: document.getElementById("field-age"),
        fieldCity: document.getElementById("field-city"),
        fieldBio: document.getElementById("field-bio"),
        fieldTg: document.getElementById("field-tg"),
        fieldPhoto: document.getElementById("field-photo"),
        fieldActive: document.getElementById("field-active"),
        photoPreview: document.getElementById("photo-preview"),
        photoFallback: document.getElementById("photo-preview-fallback"),
        pageTitle: document.getElementById("page-title"),
        pageSub: document.getElementById("page-sub"),
        snackbar: document.getElementById("snackbar"),
        btnSave: document.getElementById("btn-save"),
      };

      function initTelegram() {
        if (!tg) return;
        try {
          tg.ready();
          tg.expand();
          if (typeof tg.setHeaderColor === "function") tg.setHeaderColor("#0e0e12");
          if (typeof tg.setBackgroundColor === "function") tg.setBackgroundColor("#0e0e12");
          if (tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(() => {
              if (els.screenForm.classList.contains("active")) {
                showList();
              } else {
                window.location.href = "index.html";
              }
            });
          }
        } catch (_) {}
      }

      function getTelegramUser() {
        return tg?.initDataUnsafe?.user || null;
      }

      function getInitData() {
        return tg?.initData || "";
      }

      function showError(message) {
        if (!message) {
          els.errorBox.hidden = true;
          els.errorBox.textContent = "";
          return;
        }
        els.errorBox.hidden = false;
        els.errorBox.textContent = message;
      }

      function showSnackbar(text) {
        els.snackbar.textContent = text || "Сохранено ✅";
        els.snackbar.classList.add("show");
        clearTimeout(showSnackbar._t);
        showSnackbar._t = setTimeout(() => {
          els.snackbar.classList.remove("show");
        }, 2200);
      }

      function authHeaders() {
        const headers = { Accept: "application/json" };
        const initData = getInitData();
        if (initData) {
          headers["Authorization"] = "Bearer " + initData;
          headers["X-Telegram-Init-Data"] = initData;
        }
        if (state.workerId) {
          headers["X-Worker-Id"] = String(state.workerId);
        }
        return headers;
      }

      async function api(action, { method = "GET", body = null, query = {} } = {}) {
        const url = new URL(API_URL);
        url.searchParams.set("action", action);
        Object.entries(query).forEach(([k, v]) => {
          if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, String(v));
        });

        const options = {
          method,
          headers: authHeaders(),
        };

        if (body != null) {
          options.headers["Content-Type"] = "application/json";
          options.body = JSON.stringify(body);
        }

        const res = await fetch(url.toString(), options);
        let data = null;
        try {
          data = await res.json();
        } catch (_) {
          data = null;
        }

        if (!res.ok) {
          const msg = (data && data.error) || ("HTTP " + res.status);
          const err = new Error(msg);
          err.status = res.status;
          err.data = data;
          throw err;
        }
        return data;
      }

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function landingLink(id) {
        return LANDING_URL + (LANDING_URL.includes("?") ? "&" : "?") + "profile=" + encodeURIComponent(id);
      }

      function showList() {
        state.editingId = null;
        els.screenForm.classList.remove("active");
        els.screenList.classList.remove("hidden");
        els.pageTitle.textContent = "Мои анкеты";
        els.pageSub.textContent = "Управление профилями знакомств";
        if (tg?.BackButton) tg.BackButton.show();
      }

      function showForm(profile = null) {
        els.screenList.classList.add("hidden");
        els.screenForm.classList.add("active");
        state.editingId = profile?.id || null;

        els.pageTitle.textContent = profile ? "Редактирование" : "Новая анкета";
        els.pageSub.textContent = profile ? ("ID #" + profile.id) : "Заполните поля и сохраните";

        els.fieldId.value = profile?.id || "";
        els.fieldName.value = profile?.name || "";
        els.fieldAge.value = profile?.age || "";
        els.fieldCity.value = profile?.city || "";
        els.fieldBio.value = profile?.bio || "";
        els.fieldTg.value = profile?.tg_link || "";
        els.fieldPhoto.value = profile?.photo_url || "";
        els.fieldActive.checked = profile ? Number(profile.active) === 1 : true;
        updatePhotoPreview();

        if (tg?.BackButton) tg.BackButton.show();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function updatePhotoPreview() {
        const url = (els.fieldPhoto.value || "").trim();
        if (!url) {
          els.photoPreview.hidden = true;
          els.photoPreview.removeAttribute("src");
          els.photoFallback.hidden = false;
          return;
        }
        els.photoFallback.hidden = true;
        els.photoPreview.hidden = false;
        els.photoPreview.src = url;
      }

      function renderProfiles() {
        els.loading.hidden = true;
        const items = state.profiles || [];

        if (!items.length) {
          els.empty.hidden = false;
          els.list.innerHTML = "";
          return;
        }

        els.empty.hidden = true;
        els.list.innerHTML = items.map((p) => {
          const active = Number(p.active) === 1;
          const photo = (p.photo_url || "").trim();
          const thumb = photo
            ? `<img class="thumb" src="${escapeHtml(photo)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.hidden=false" />
               <div class="thumb thumb-fallback" hidden>👤</div>`
            : `<div class="thumb thumb-fallback">👤</div>`;

          return `
            <article class="card" data-id="${p.id}">
              <div class="card-head">
                ${thumb}
                <div class="meta">
                  <h3>${escapeHtml(p.name || "Без имени")}, ${escapeHtml(p.age || "—")}</h3>
                  <div class="sub">${escapeHtml(p.city || "Город не указан")}</div>
                  <div class="status">${active ? "🟢 Активна" : "🔴 Выключена"}</div>
                </div>
              </div>
              <div class="stats-line">
                <span>Переходы: <strong>${Number(p.clicks) || 0}</strong></span>
                <button class="btn btn-secondary btn-sm" type="button" data-action="copy" data-id="${p.id}">Получить ссылку</button>
              </div>
              <div class="actions">
                <button class="btn btn-secondary btn-sm" type="button" data-action="edit" data-id="${p.id}">✏️ Редактировать</button>
                <button class="btn btn-danger btn-sm" type="button" data-action="delete" data-id="${p.id}">🗑 Удалить</button>
              </div>
            </article>
          `;
        }).join("");
      }

      async function loadProfiles() {
        els.loading.hidden = false;
        els.empty.hidden = true;
        showError("");

        try {
          const data = await api("get_worker_profiles", {
            query: { worker_id: state.workerId },
          });
          state.profiles = Array.isArray(data) ? data : [];
          renderProfiles();
        } catch (err) {
          els.loading.hidden = true;
          state.profiles = [];
          renderProfiles();
          if (err.status === 403 && String(err.message).includes("worker")) {
            showError("Воркер не найден в БД. Добавьте запись в workers с id = ваш Telegram user.id.");
          } else if (err.status === 401) {
            showError("Откройте раздел внутри Telegram Mini App для авторизации.");
          } else {
            showError("Не удалось загрузить анкеты: " + err.message);
          }
        }
      }

      async function copyLink(id) {
        const link = landingLink(id);
        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(link);
          } else {
            const ta = document.createElement("textarea");
            ta.value = link;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            ta.remove();
          }
          showSnackbar("Ссылка скопирована ✅");
          if (tg?.HapticFeedback?.notificationOccurred) {
            tg.HapticFeedback.notificationOccurred("success");
          }
        } catch (_) {
          showSnackbar(link);
        }
      }

      async function deleteProfile(id) {
        const ok = window.confirm("Удалить анкету #" + id + "?");
        if (!ok) return;

        try {
          await api("delete_profile", {
            method: "POST",
            query: { id },
            body: { id, worker_id: state.workerId, initData: getInitData() },
          });
          showSnackbar("Удалено ✅");
          await loadProfiles();
        } catch (err) {
          showError("Удаление не удалось: " + err.message);
        }
      }

      async function saveProfile(event) {
        event.preventDefault();

        const name = els.fieldName.value.trim();
        const age = Number(els.fieldAge.value);
        const city = els.fieldCity.value.trim();
        const bio = els.fieldBio.value.trim();
        const tgLink = els.fieldTg.value.trim();
        const photoUrl = els.fieldPhoto.value.trim();
        const active = els.fieldActive.checked ? 1 : 0;
        const idRaw = els.fieldId.value.trim();
        const id = idRaw ? Number(idRaw) : null;

        if (!name) {
          showError("Укажите имя");
          return;
        }
        if (!Number.isFinite(age) || age < 18 || age > 45) {
          showError("Возраст должен быть от 18 до 45");
          return;
        }

        const payload = {
          worker_id: state.workerId,
          initData: getInitData(),
          name,
          age,
          city,
          bio,
          tg_link: tgLink,
          photo_url: photoUrl,
          active,
        };
        if (id) payload.id = id;

        els.btnSave.disabled = true;
        showError("");

        try {
          await api("save_profile", { method: "POST", body: payload });
          showSnackbar("Сохранено ✅");
          if (tg?.HapticFeedback?.notificationOccurred) {
            tg.HapticFeedback.notificationOccurred("success");
          }
          showList();
          await loadProfiles();
        } catch (err) {
          showError("Сохранение не удалось: " + err.message);
        } finally {
          els.btnSave.disabled = false;
        }
      }

      function bindEvents() {
        document.getElementById("btn-back-main").addEventListener("click", () => {
          if (els.screenForm.classList.contains("active")) {
            showList();
          } else {
            window.location.href = "index.html";
          }
        });

        document.getElementById("btn-create").addEventListener("click", () => showForm(null));
        document.getElementById("btn-cancel").addEventListener("click", showList);
        els.form.addEventListener("submit", saveProfile);
        els.fieldPhoto.addEventListener("input", updatePhotoPreview);
        els.photoPreview.addEventListener("error", () => {
          els.photoPreview.hidden = true;
          els.photoFallback.hidden = false;
        });

        els.list.addEventListener("click", (event) => {
          const btn = event.target.closest("button[data-action]");
          if (!btn) return;
          const id = Number(btn.dataset.id);
          const action = btn.dataset.action;
          const profile = state.profiles.find((p) => Number(p.id) === id);

          if (action === "edit" && profile) showForm(profile);
          if (action === "delete") deleteProfile(id);
          if (action === "copy") copyLink(id);
        });
      }

      async function boot() {
        initTelegram();
        bindEvents();

        const user = getTelegramUser();
        if (user?.id) {
          state.workerId = Number(user.id);
        } else {
          // Тест вне Telegram: можно подставить ?worker_id=
          const q = new URLSearchParams(window.location.search);
          const wid = Number(q.get("worker_id") || 0);
          if (wid > 0) state.workerId = wid;
        }

        if (!state.workerId) {
          els.loading.hidden = true;
          showError("Нет Telegram user.id. Откройте Mini App из бота.");
          return;
        }

        await loadProfiles();
      }

      boot();
    })();
  </script>
</body>
</html>
